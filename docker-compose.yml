name: d8x

services:
  cache:
    image: redis:6.2-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sentinel-base_sepolia:
    image: ghcr.io/d8-x/liquidator-sentinel:dev
    #build:
    #  context: .
    #  dockerfile: ./src/sentinel/Dockerfile
    depends_on:
      cache:
        condition: service_healthy
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 4
      SDK_CONFIG: base_sepolia
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  commander-base_sepolia:
    image: ghcr.io/d8-x/liquidator-commander:dev
    depends_on:
      cache:
        condition: service_healthy
    #build:
    #  context: .
    #  dockerfile: ./src/commander/Dockerfile
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 4
      SDK_CONFIG: base_sepolia
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
      METRICS_PORT: "9011"
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  executor-base_sepolia:
    image: ghcr.io/d8-x/liquidator-executor:dev
    depends_on:
      cache:
        condition: service_healthy
      commander-base_sepolia:
        condition: service_started
    #build:
    #  context: .
    #  dockerfile: ./src/executor/Dockerfile
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 4
      SDK_CONFIG: base_sepolia
      SEED_PHRASE: ${SEED_PHRASE}
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  sentinel-base:
    image: ghcr.io/d8-x/liquidator-sentinel:dev
    depends_on:
      cache:
        condition: service_healthy
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 5
      SDK_CONFIG: base
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  commander-base:
    image: ghcr.io/d8-x/liquidator-commander:dev  # <--- we need to properly start pulling main for prod
    depends_on:
      cache:
        condition: service_healthy
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 5
      SDK_CONFIG: base
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
      METRICS_PORT: "9011"
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  executor-base:
    image: ghcr.io/d8-x/liquidator-executor:dev
    depends_on:
      cache:
        condition: service_healthy
      commander-base:
        condition: service_started
    environment:
      REDIS_HOST: cache
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ID: 5
      SDK_CONFIG: base
      SEED_PHRASE: ${SEED_PHRASE}
      LIQUIDATOR_CONFIG_PATH: /etc/liquidatorconf.json
    configs:
      - source: liquidator_config
        target: /etc/liquidatorconf.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

  # Prometheus with alertmanager
  prometheus:
    image: prom/prometheus:latest
    command: [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--web.console.libraries=/usr/share/prometheus/console_libraries",
        "--web.console.templates=/usr/share/prometheus/consoles",
        # Enable external label expansion
        "--enable-feature=expand-external-labels",
      ]
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_yaml
        target: /etc/prometheus/prometheus.yml
      - source: rules_1
        target: /etc/prometheus/rules/liquidator.rules.yaml
    restart: always
    environment:
      PROMETHEUS_DEPLOYMENT_NAME: ${PROMETHEUS_DEPLOYMENT_NAME}
      PROMETHEUS_SERVER_IP: ${PROMETHEUS_SERVER_IP}
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - 127.0.0.1:9093:9093
    restart: always
    configs:
      - source: alertmanager_slack_url
        target: /etc/alertmanager/slack_api_url.txt
      - source: alertmanager_yaml
        target: /etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: always
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "10"

volumes:
  prometheus_data:
  grafana_data:
configs:
  prometheus_yaml:
    file: ./prometheus_configs/prometheus.yaml
  alertmanager_slack_url:
    file: ./prometheus_configs/prometheus_alertmanager_slack_url.txt
  alertmanager_yaml:
    file: ./prometheus_configs/prometheus_alertmanager.yaml
  rules_1:
    file: ./prometheus_configs/liquidator.rules.yaml
  liquidator_config:
    file: ./config/live.liquidatorConfig.json