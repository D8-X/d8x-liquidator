groups:
  - name: liquidator_alerts
    rules:
      - alert: TxFailures
        expr: increase(liquidator_liquidations_total{outcome="failed"}[5m]) > 5
        # Do not wait to fire the alert when the condition is met
        # for: 1m
        labels:
          severity: warning
        annotations:
          title: "Liquidation transaction failed (Liquidator)"
          server_info: "Deployment {{ $externalLabels.deployment_name }} | Server IP {{ $externalLabels.server_ip }}"

      - alert: TxRejections
        expr: increase(liquidator_liquidations_total{outcome="rejected"}[5m]) > 5
        # Do not wait to fire the alert when the condition is met
        # for: 1m
        labels:
          severity: warning
        annotations:
          title: "Liquidation transaction rejected (Liquidator)"
          server_info: "Deployment {{ $externalLabels.deployment_name }} | Server IP {{ $externalLabels.server_ip }}"

      - alert: FundingFailure
        expr: increase(liquidator_funding_failures_total[5m]) > 5
        # Do not wait to fire the alert when the condition is met
        # for: 1m
        labels:
          severity: warning
        annotations:
          title: "Funding bot failed (Liquidator)"
          server_info: "Deployment {{ $externalLabels.deployment_name }} | Server IP {{ $externalLabels.server_ip }}"

      - alert: BotLowBalance
        expr: liquidator_bot_balance_eth < on(chain) group_left() liquidator_min_balance_eth
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "Bot wallet below per-chain minimum gas balance (Liquidator)"
          server_info: "Deployment {{ $externalLabels.deployment_name }} | Server IP {{ $externalLabels.server_ip }}"

      - alert: BotIdle
        expr: time() - liquidator_last_liquidation_timestamp_seconds > 86400
        for: 5m
        labels:
          severity: info
        annotations:
          title: "Bot has not liquidated in 24h (Liquidator)"
          server_info: "Deployment {{ $externalLabels.deployment_name }} | Server IP {{ $externalLabels.server_ip }}"
